<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }
        header {
            background-color: #001f3f;
            color: white;
            padding: 20px 0;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 2.5rem;
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #001f3f;
            margin-bottom: 20px;
        }
        p {
            text-align: center;
            margin-bottom: 30px;
            color: #555;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, 
        .form-group textarea, 
        .form-group button {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .form-group textarea {
            resize: none;
            height: 120px;
        }
        .form-group button {
            background-color: #001f3f;
            color: white;
            border: none;
            cursor: pointer;
        }
        .form-group button:hover {
            background-color: #073564;
        }
        footer {
            text-align: center;
            padding: 10px 0;
            background-color: #333;
            color: #fff; 
            font-weight: bold; 
            margin-top: 30px;
        }

        #button {
            background-color: #001f3f; 
            color: white;
            font-weight: bold;
        }
        #button:active {
            background-color: #073564; 
        }

    </style>
</head>
<body>
    <header>
        <h1>Contact Us</h1>
    </header>
    <div class="container">
        <h2>We'd Love to Hear From You!</h2>
        <p>
            If you have any questions, feedback, or inquiries, feel free to reach out using the form below. 
            Our team is here to assist you.
        </p>
        <form id="form">
            <!-- Name -->
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            </div>
            <!-- Email -->
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <!-- Phone -->
            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
            </div>
            <!-- Message -->
            <div class="form-group">
                <label for="message">Your Message:</label>
                <textarea id="message" name="message" placeholder="Enter your message" required></textarea>
            </div>
            <!-- Submit Button -->
            <div class="form-group">
                <input type="submit" id="button" value="Send Message" >
            </div>
        </form>
    </div>
    <footer>
        <p>© 2025 Car Information System. All Rights Reserved.</p>
    </footer>

<script type="text/javascript"
    src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
      
    <script type="text/javascript">
        emailjs.init('jMiw1MVXkdxUsrT8F')
    </script>
    </div>
    <script>
        const btn = document.getElementById('button');

        document.getElementById('form')
        .addEventListener('submit', function(event) {
        event.preventDefault();

        btn.value = 'Sending...';

        const serviceID = 'service_e64b14j';
        const templateID = 'template_hj4u1l4';

        emailjs.sendForm(serviceID, templateID, this)
            .then(() => {
            btn.value = 'Send Message';
            alert('Sent!');
            }, (err) => {
            btn.value = 'Send Message';
            alert(JSON.stringify(err));
            });
        });
    </script>
</body>
</html>

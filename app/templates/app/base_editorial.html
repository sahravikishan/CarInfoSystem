<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Car Info System{% endblock %}</title>
    <!-- Modern Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'app/css/Navbar.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body style="background-color: #000; color: #fff; margin: 0; padding-top: 75px;">
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background-color: #000000; height: 75px; padding: 0; border-bottom: 1px solid #333;">
        <div class="container-fluid" style="height: 100%; display: flex; align-items: center; justify-content: space-between;">
            <a class="navbar-brand d-flex align-items-center" href="{% url 'home' %}" style="height: 100%; padding: 0;">
                <img src="{% static 'app/Image/car_icon.jpg' %}" alt="Logo" style="height: 50px; width: auto; object-fit: contain; margin-left: 20px;">
                <span class="ms-2" style="font-weight: bold; font-size: 1.2rem; color: #fff;">Car Info System</span>
            </a>
            <div style="margin-right: 20px;">
                <a href="{% url 'home' %}" class="btn btn-outline-light me-2">Home</a>
                <a href="{% url 'compare' %}" class="btn btn-outline-light me-2">Compare</a>
            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
